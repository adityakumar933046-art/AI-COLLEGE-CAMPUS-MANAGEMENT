<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject %}Smart Campus Notification{% endblock %}</title>
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 24px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
        <!-- Header -->
        <tr>
            <td style="background-color: #0f172a; padding: 28px 32px; text-align: center;">
                <h2 style="color: #38bdf8; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px;">SMART CAMPUS</h2>
                <p style="color: #94a3b8; margin: 4px 0 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Academic Management System</p>
            </td>
        </tr>

        <!-- Main Content Body -->
        <tr>
            <td style="padding: 32px;">
                {% block content %}{% endblock %}
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="background-color: #f1f5f9; padding: 20px 32px; text-align: center; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b;">
                <p style="margin: 0 0 6px 0;">This is an automated security message from Smart Campus.</p>
                <p style="margin: 0;">&copy; 2026 Smart Campus Academic ERP. All rights reserved.</p>
            </td>
        </tr>
    </table>
</body>
</html>
