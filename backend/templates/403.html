{% extends "base.html" %}
{% block title %}Permission Denied (403) | Smart Campus{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3 p-4">
        <div class="card-body">
            <div class="display-1 text-danger mb-3">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="fw-bold mb-2 text-dark">Access Denied</h2>
            <p class="text-muted mb-4">
                You do not have permission to access this page or perform this action.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                    <i class="bi bi-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
