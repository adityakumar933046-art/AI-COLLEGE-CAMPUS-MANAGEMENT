{% extends "base.html" %}
{% block title %}Server Error (500) | Smart Campus{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3 p-4">
        <div class="card-body">
            <div class="display-1 text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h2 class="fw-bold mb-2 text-dark">Unexpected Server Error</h2>
            <p class="text-muted mb-4">
                Something went wrong on our end while processing your request. 
                Our team has been notified, and your data remains safe.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                    <i class="bi bi-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
