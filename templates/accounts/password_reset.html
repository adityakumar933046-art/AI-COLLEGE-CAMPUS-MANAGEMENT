{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <h2 class="mb-4 text-center">
        Forgot Password
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100">
            Send Reset Link
        </button>

    </form>

    <div class="mt-3 text-center">
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </div>

</div>

{% endblock %}
