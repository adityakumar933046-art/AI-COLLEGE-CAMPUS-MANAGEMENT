{% extends "base.html" %}

{% block title %}Set New Password | Smart Campus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-lock me-2"></i>Set New Password</h4>
                    <p class="small text-white-50 mb-0">Create a new secure password</p>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{% url 'reset_password' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="new_password1" class="form-label font-weight-bold">New Password</label>
                            <input type="password" name="new_password1" id="new_password1" class="form-control" placeholder="New Password" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="new_password2" class="form-label font-weight-bold">Confirm New Password</label>
                            <input type="password" name="new_password2" id="new_password2" class="form-control" placeholder="Confirm New Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-check-lg me-1"></i>Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
